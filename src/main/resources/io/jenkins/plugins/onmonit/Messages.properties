ONMonitoringStep.DisplayName = Start node_exporter + otel-contrib before the build, and shut them down after.
ONMonitoringStep.Started = node_exporter + otel-contrib started
ONMonitoringStep.Stopped = node_exporter + otel-contrib stopped
ONMonitoringStep.CouldNotStartProcesses = Could not start node_exporter + otel-contrib processes
ONMonitoringStep.CouldNotRestartProcesses = [on-monit] WARNING: Could not restart node_exporter + otel-contrib after the controller restart; continuing without metrics
